[browser]
# A dedicated Edge user-data root inside this project. ref-downloader launches
# its "Default" profile below this directory; it never opens the daily profile.
edge_profile_dir = "browser_profiles/edge-autopaper"
disable_extensions = false

[institution]
# The current test uses campus IP access, so no SSO pattern is needed yet.
auth_hosts = []
auth_url_fragments = []
auth_page_titles = []
auth_loading_titles = []
ignored_access_dois = []

[user]
verified_no_si_dois = []
